name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - run: bun run doctor
      - run: bun run audit:ci
      - run: bun run verify

  database:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vibe_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vibe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibe_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vibe_test
      CORS_ORIGINS: http://localhost:5173
      JWT_ACCESS_SECRET: ci-access-secret-not-for-production
      JWT_REFRESH_SECRET: ci-refresh-secret-not-for-production
      AUTH_COOKIE_SECURE: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run db:migrate
      - run: bun --filter '@vibe/api' db:check
      - run: bun --filter '@vibe/api' test:db

  container:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build production reference images
        run: |
          docker build -f deploy/Dockerfile --target web -t vibe-web:ci .
          docker build -f deploy/Dockerfile --target api -t vibe-api:ci .
      - name: Validate static build and TLS reverse-proxy configuration
        run: |
          docker run --rm --entrypoint sh vibe-web:ci -c 'test -f /srv/web/index.html && test -f /srv/web/200.html'
          docker run --rm --entrypoint caddy -e SITE_DOMAIN=app.example.com vibe-web:ci validate --config /etc/caddy/Caddyfile
      - name: Validate reference Compose and production fail-closed guard
        run: |
          cp deploy/.env.production.example deploy/.env.production
          docker compose -f deploy/compose.yaml --env-file deploy/.env.production config --quiet
          rm deploy/.env.production
          if docker run --rm -e NODE_ENV=production -e CORS_ORIGINS=https://app.example.com -e JWT_ACCESS_SECRET=ci-access-123456789012345678901234567890 -e JWT_REFRESH_SECRET=ci-refresh-123456789012345678901234567890 vibe-api:ci > /tmp/api-preflight.log 2>&1; then
            echo 'Production API unexpectedly started without DATABASE_URL'
            exit 1
          fi
          cat /tmp/api-preflight.log
          grep -q 'Production API container requires DATABASE_URL' /tmp/api-preflight.log

  e2e:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: "24.21.0"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2
      - run: |
          if [ -f bun.lock ] || [ -f bun.lockb ]; then
            bun install --frozen-lockfile
          else
            bun install
          fi
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:e2e
